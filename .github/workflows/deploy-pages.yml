# main 브랜치에 push하면 web/ 폴더를 GitHub Pages로 배포합니다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번만 바꿔 주세요.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Bump service-worker cache version
        run: sed -i "s/const CACHE = 'meetnote-[^']*';/const CACHE = 'meetnote-${GITHUB_SHA::8}';/" web/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
